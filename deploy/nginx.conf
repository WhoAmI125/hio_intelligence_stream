# ============================================================
# nginx configuration for HIO v3
# ============================================================
#
# Architecture:
#   nginx (80/443) -> frontend_server (127.0.0.1:8002)
#   frontend_server internally proxies to:
#     - model_server (127.0.0.1:8000)
#     - db_server    (127.0.0.1:8001)
#
# Installation:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hio-v3
#   sudo ln -sf /etc/nginx/sites-available/hio-v3 /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt):
#   sudo certbot --nginx -d YOUR_DOMAIN --non-interactive --agree-tos -m YOUR_EMAIL
# ============================================================

upstream hio_frontend {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name _;  # replace with your domain when ready

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy everything to frontend_server (which reverse-proxies model + db).
    location / {
        proxy_pass http://hio_frontend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running MJPEG live previews + Gemini validation uploads
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Streaming responses: no buffering / caching
        proxy_buffering off;
        proxy_cache off;
    }

    # Direct health endpoint (no upstream)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Allow large candidate-clip uploads to model_server
    client_max_body_size 100M;
}

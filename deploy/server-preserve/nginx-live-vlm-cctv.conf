# Snapshot from /etc/nginx/sites-available/vlm-cctv on 2026-04-10

upstream vlm_frontend {
    server 127.0.0.1:8002;
}

server {
    server_name dev-cctv.hio.ai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://vlm_frontend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache off;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    client_max_body_size 100M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dev-cctv.hio.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-cctv.hio.ai.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dev-cctv.hio.ai.kr) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name dev-cctv.hio.ai.kr;
    return 404;
}
